<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>수업 기록 입력 · 지아나영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="gi">

<header class="gi-head">
  <div class="gi-wrap">
    <p class="gi-head-brand">Gianna English</p>
    <h1>수업 기록 입력</h1>
    <p class="gi-head-sub" id="headSub">선생님 전용</p>
  </div>
</header>

<main class="gi-wrap">

  <section id="loginView">
    <div id="loginError" class="gi-error" hidden></div>
    <div class="gi-field">
      <label class="gi-label" for="password">비밀번호</label>
      <input class="gi-input" type="password" id="password" autocomplete="current-password">
    </div>
    <button class="gi-btn gi-btn-primary" id="loginBtn" type="button">로그인</button>
  </section>

  <section id="appView" hidden>
    <nav style="display:flex;gap:.5rem;margin-bottom:1.2rem">
      <button class="gi-choice" id="tabEntry" type="button" aria-pressed="true">수업 입력</button>
      <button class="gi-choice" id="tabStudents" type="button" aria-pressed="false">학생 관리</button>
    </nav>

    <div id="entryView">
      <div class="gi-field">
        <label class="gi-label" for="classSelect">반</label>
        <select class="gi-select" id="classSelect"></select>
      </div>
      <div class="gi-field">
        <label class="gi-label" for="dateInput">날짜</label>
        <input class="gi-input" type="date" id="dateInput">
      </div>

      <div id="entryError" class="gi-error" hidden></div>
      <div id="roster"></div>
    </div>

    <div id="recordView" hidden>
      <button class="gi-btn gi-btn-outline" id="recordBack" type="button">← 돌아가기</button>
      <h2 class="gi-h2" id="recordWho"></h2>

      <div class="gi-field">
        <label class="gi-label" for="recordDateInput">수업 날짜</label>
        <input class="gi-input" type="date" id="recordDateInput">
      </div>

      <div id="recordError" class="gi-error" hidden></div>

      <div class="gi-field">
        <span class="gi-label">진도</span>
        <div id="recAreas"></div>
        <p class="gi-note" id="recLegacyProgress" hidden></p>
      </div>

      <div class="gi-field">
        <span class="gi-label">출결</span>
        <div class="gi-choices" id="recAttendance"></div>
      </div>

      <div class="gi-field">
        <span class="gi-label">과제</span>
        <div class="gi-choices" id="recHomeworkStatus"></div>
      </div>

      <div class="gi-field">
        <span class="gi-label">완성도</span>
        <div class="gi-choices" id="recHomeworkLevel"></div>
      </div>

      <div class="gi-field">
        <span class="gi-label">시험</span>
        <div id="recTests"></div>
        <p class="gi-note" id="recLegacyTest" hidden></p>
      </div>

      <div class="gi-field">
        <span class="gi-label">다음 과제</span>
        <div id="recNext"></div>
        <p class="gi-note" id="recLegacyNext" hidden></p>
      </div>

      <div class="gi-field">
        <label class="gi-label" for="recComment">코멘트</label>
        <textarea class="gi-textarea" id="recComment" data-field="comment"></textarea>
      </div>

      <div class="gi-savebar">
        <span class="gi-note" id="recordStatus"></span>
        <button class="gi-btn gi-btn-primary" id="recordSaveBtn" type="button">저장</button>
      </div>
    </div>

    <div id="studentsView" hidden></div>
  </section>

</main>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/progress-areas.js"></script>
<script src="/assets/js/record-form.js"></script>
<script src="/assets/js/admin.js"></script>
<script src="/assets/js/admin-students.js"></script>
</body>
</html>
