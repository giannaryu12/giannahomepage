<!DOCTYPE html>
<!-- data-theme="light": 학부모 화면과 같은 색으로 고정한다. 두 화면이
     기기 설정에 따라 다르게 보이면 같은 앱으로 읽히지 않는다. -->
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>수업 기록 입력 · 지아나영어</title>
<link rel="stylesheet" href="/assets/css/tokens.css?v=20261104c">
<link rel="stylesheet" href="/assets/css/app.css?v=20261104c">
</head>
<body class="gi">

<header class="gi-head gi-head-tight">
  <div class="gi-wrap gi-wrap-wide gi-head-line">
    <p class="gi-head-brand">Gianna English</p>
    <h1>수업 기록 입력</h1>
    <p class="gi-head-sub" id="headSub">선생님 전용</p>
    <!-- 로그인 전에는 누를 일이 없다. 머리글은 두 화면이 함께 쓰므로
         화면이 바뀔 때 admin.js가 켜고 끈다. -->
    <button class="gi-choice gi-head-out" id="logoutBtn" type="button" hidden>로그아웃</button>
  </div>
</header>

<main class="gi-wrap gi-wrap-wide">

  <section id="loginView">
    <div id="loginError" class="gi-error" hidden></div>
    <div class="gi-field">
      <label class="gi-label" for="password">비밀번호</label>
      <input class="gi-input" type="password" id="password" autocomplete="current-password">
    </div>
    <button class="gi-btn gi-btn-primary" id="loginBtn" type="button">로그인</button>
    <p class="gi-note" id="loginStatus" style="margin-top:.6rem"></p>
  </section>

  <section id="appView" hidden>
    <nav style="display:flex;gap:.5rem;margin-bottom:1.2rem">
      <button class="gi-choice" id="tabSchedule" type="button" aria-pressed="true">수업 일정</button>
      <button class="gi-choice" id="tabStudents" type="button" aria-pressed="false">학생 관리</button>
    </nav>

    <div id="scheduleView">
      <div class="gi-week">
        <button class="gi-choice" id="weekPrev" type="button">← 지난달</button>
        <span class="gi-week-label" id="weekLabel"></span>
        <button class="gi-choice" id="weekNext" type="button">다음달 →</button>
        <button class="gi-choice" id="weekToday" type="button">이번 달</button>
      </div>

      <div id="scheduleError" class="gi-error" hidden></div>
      <!-- 넓은 화면에서는 고치는 칸이 달력 오른쪽에 선다. 좁은 화면에서는
           달력 아래로 내려간다 — 같은 DOM 순서로 둘 다 된다. -->
      <div class="gi-cal-wrap">
        <div id="timetable"></div>
        <div id="dayEdit" hidden></div>
      </div>
    </div>

    <div id="recordView" hidden>
      <!-- 탭 단추(수업 일정·학생 관리)와 같은 크기·글자다. 돌아가는 일은
           탭을 옮기는 일과 같은 무게라, 혼자 커 보일 까닭이 없다. -->
      <button class="gi-choice" id="recordBack" type="button">← 돌아가기</button>
      <h2 class="gi-h2" id="recordWho"></h2>

      <div class="gi-field">
        <label class="gi-label" for="recordDateInput">수업 날짜</label>
        <input class="gi-input" type="date" id="recordDateInput">
      </div>

      <div id="recordError" class="gi-error" hidden></div>

      <!-- 정기수업과 시험대비는 같은 날에 따로 쌓인다. 탭을 옮기면 그 날의
           그 갈래 기록을 연다 — 서버에 다시 묻지 않는다. -->
      <div class="gi-choices gi-kind-tabs" id="recKindTabs">
        <button class="gi-choice" type="button" data-kind="regular" aria-pressed="true">정기수업</button>
        <button class="gi-choice" type="button" data-kind="exam" aria-pressed="false">시험대비</button>
      </div>

      <!-- 회차는 두 갈래가 함께 쓴다. 시험대비도 그 학생에게는 한 회차다. -->
      <div class="gi-field">
        <label class="gi-label" for="recSessionNo">회차</label>
        <input class="gi-input" type="number" inputmode="numeric" min="1"
               id="recSessionNo" data-field="sessionNo" placeholder="예: 12">
      </div>

      <div id="regularFields">

      <div class="gi-field gi-field-inline">
        <span class="gi-label">출결</span>
        <div class="gi-choices" id="recAttendance"></div>
      </div>

      <div class="gi-field gi-field-inline">
        <span class="gi-label">과제</span>
        <div class="gi-choices" id="recHomeworkStatus"></div>
      </div>

      <div class="gi-field gi-field-inline">
        <span class="gi-label">완성도</span>
        <div class="gi-choices" id="recHomeworkLevel"></div>
      </div>

      <div class="gi-field">
        <span class="gi-label">시험</span>
        <div id="recTests"></div>
        <p class="gi-note" id="recLegacyTest" hidden></p>
      </div>

      <div class="gi-field">
        <span class="gi-label">진도</span>
        <div id="recAreas"></div>
        <p class="gi-note" id="recLegacyProgress" hidden></p>
      </div>

      <div class="gi-field">
        <span class="gi-label">숙제</span>
        <div id="recNext"></div>
        <p class="gi-note" id="recLegacyNext" hidden></p>
      </div>

      </div>

      <!-- 시험대비는 시험·진도·숙제뿐이다. 칸은 선생님이 만들고 지운다. -->
      <div id="examFields" hidden>
        <div class="gi-field">
          <span class="gi-label">시험</span>
          <div id="examTests"></div>
          <button class="gi-choice gi-exam-add" type="button" data-exam-add="examTests">+ 칸 추가</button>
          <!-- 세 낱말의 뜻을 적어 둔다. 미통과와 미응시는 학부모에게 아주
               다른 말인데, 적어 두지 않으면 누르는 사람마다 달리 쓴다. -->
          <p class="gi-note gi-exam-legend">
            통과: 기준 점수 이상<br>
            미통과: 응시했지만 기준 미달<br>
            미응시: 결석·연기 등으로 시험을 안 봄
          </p>
        </div>

        <div class="gi-field">
          <span class="gi-label">진도</span>
          <div id="examItems"></div>
          <button class="gi-choice gi-exam-add" type="button" data-exam-add="examItems">+ 칸 추가</button>
        </div>

        <div class="gi-field">
          <span class="gi-label">숙제</span>
          <div id="examNext"></div>
          <button class="gi-choice gi-exam-add" type="button" data-exam-add="examNext">+ 칸 추가</button>
        </div>
      </div>

      <!-- 코멘트는 두 갈래가 함께 쓴다. 적는 칸은 하나지만 값은 갈래마다
           따로다 — 정기수업에 적은 한마디가 시험대비에 묻어 나오지 않는다. -->
      <div class="gi-field">
        <label class="gi-label" for="recComment">코멘트</label>
        <textarea class="gi-textarea" id="recComment" data-field="comment"></textarea>
      </div>

      <div class="gi-savebar">
        <span class="gi-note" id="recordStatus"></span>
        <button class="gi-btn gi-btn-primary" id="recordSaveBtn" type="button">저장</button>
      </div>
    </div>

    <div id="studentsView" hidden></div>
  </section>

</main>

<script src="/assets/js/config.js?v=20261104c"></script>
<script src="/assets/js/api.js?v=20261104c"></script>
<script src="/assets/js/progress-areas.js?v=20261104c"></script>
<script src="/assets/js/exam-items.js?v=20261104c"></script>
<script src="/assets/js/class-level.js?v=20261104c"></script>
<script src="/assets/js/schedule.js?v=20261104c"></script>
<script src="/assets/js/record-form.js?v=20261104c"></script>
<script src="/assets/js/admin.js?v=20261104c"></script>
<script src="/assets/js/admin-students.js?v=20261104c"></script>
<script src="/assets/js/admin-schedule.js?v=20261104c"></script>
</body>
</html>
