<!DOCTYPE html>
<!-- data-theme="light": 보는 사람의 기기가 다크 모드여도 초록 머리 +
     흰 바탕으로 똑같이 보인다. 카카오톡으로 링크를 받은 학부모가 저마다
     다른 색의 화면을 보면 안내하기가 어렵다. -->
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>학습 리포트 · 지아나영어</title>
<link rel="stylesheet" href="/assets/css/tokens.css?v=20261105p">
<link rel="stylesheet" href="/assets/css/app.css?v=20261105p">
</head>
<body class="gi">

<header class="gi-head gi-head-parent">
  <div class="gi-wrap">
    <p class="gi-head-brand">Gianna English</p>
    <h1 id="studentName">학습 리포트</h1>
    <p class="gi-head-sub" id="studentMeta"></p>
  </div>
</header>

<main class="gi-wrap">
  <div id="state" class="gi-state">불러오는 중…</div>
  <div id="content" hidden>
    <!-- 탭 둘. 요약·추이·기록은 지난 수업을 읽는 곳이고, 일정은 이번 달에
         오는 날을 보는 곳이다. 한 화면에 이어 두면 달력이 기록 수십 개
         아래 묻혀 스크롤 끝까지 내려가야 나온다. -->
    <nav class="gi-choices gi-tabs" id="parentTabs">
      <button class="gi-choice" type="button" data-tab="report" aria-pressed="true">학습 기록</button>
      <button class="gi-choice" type="button" data-tab="plan" aria-pressed="false">수업 일정</button>
    </nav>

    <div id="reportTab">
      <section id="cards"></section>
      <h2 class="gi-h2">성적 추이</h2>
      <div class="gi-chart" id="chart"></div>
      <h2 class="gi-h2">수업 기록</h2>
      <div id="records"></div>
      <button class="gi-btn gi-more" id="moreRecords" type="button" hidden>더보기</button>
    </div>

    <div id="planTab" hidden>
      <div class="gi-week" id="calNav">
        <button class="gi-choice" type="button" data-mon="-1">← 지난달</button>
        <span class="gi-week-label" id="calLabel"></span>
        <button class="gi-choice" type="button" data-mon="1">다음달 →</button>
        <button class="gi-choice" type="button" data-mon="0">이번 달</button>
      </div>
      <div id="parentCal"></div>
      <p class="gi-note gi-cal-legend">
        <span class="gi-dot is-good"></span> 출석
        <span class="gi-dot is-warn"></span> 지각
        <span class="gi-dot is-bad"></span> 결석
        <span class="gi-dot is-extra"></span> 보강
        <!-- 달력에 서는 날은 선생님이 출결을 적어 둔 날뿐이다. 다른 날을
             세지 않는 까닭을 적어 두지 않으면, 쉬기로 한 날과 아직 적지
             않은 날이 다 빠진 달력이 "수업이 적었다"로 읽힌다. -->
        <span class="gi-cal-legend-note">지난 수업은 출결을 적은 날만, 앞으로 올 수업은 시간만 보입니다.</span>
      </p>
    </div>
  </div>
</main>

<script src="/assets/js/config.js?v=20261105p"></script>
<script src="/assets/js/api.js?v=20261105p"></script>
<script src="/assets/js/progress-areas.js?v=20261105p"></script>
<script src="/assets/js/exam-items.js?v=20261105p"></script>
<script src="/assets/js/class-level.js?v=20261105p"></script>
<script src="/assets/js/schedule.js?v=20261105p"></script>
<script src="/assets/js/format.js?v=20261105p"></script>
<script src="/assets/js/parent-schedule.js?v=20261105p"></script>
<script src="/assets/js/parent.js?v=20261105p"></script>
</body>
</html>
